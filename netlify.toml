[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Platform caps (not configurable): synchronous functions 60s, background 15 min.
# Generate must return a job id from the sync function. Wan runs in the background worker.
[functions."generate-background"]
  background = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
